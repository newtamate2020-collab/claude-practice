<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイピング練習 - 物語編</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #f5f5f7;
      color: #333;
      margin: 0;
      padding: 0;
      line-height: 1.7;
    }

    header {
      background-color: #2b2d42;
      color: #ffffff;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      margin: 0 0 8px 0;
      font-size: 1.8em;
    }

    header p {
      margin: 0;
      color: #cfd2e3;
    }

    main {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 20px 24px;
      box-sizing: border-box;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    #start-screen {
      text-align: center;
    }

    button {
      font-size: 1em;
      font-weight: bold;
      padding: 12px 24px;
      margin: 6px;
      border: none;
      border-radius: 6px;
      background-color: #ef233c;
      color: #ffffff;
      cursor: pointer;
    }

    button:hover {
      background-color: #d90429;
    }

    button.secondary {
      background-color: #2b2d42;
    }

    button.secondary:hover {
      background-color: #454873;
    }

    .custom-count {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .custom-count input[type="number"],
    .custom-count select {
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-right: 8px;
      text-align: center;
    }

    /* プレイ中の画面 */
    #play-screen {
      display: none;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.95em;
      color: #666;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status-bar span {
      background-color: #f5f5f7;
      padding: 6px 12px;
      border-radius: 6px;
    }

    /* 見本の文章と入力欄を横に並べる */
    .typing-area {
      display: flex;
      gap: 16px;
      align-items: stretch;
    }

    .typing-area > * {
      flex: 1 1 0;
      min-width: 0;
      box-sizing: border-box;
      height: 500px;
    }

    @media (max-width: 700px) {
      .typing-area {
        flex-direction: column;
      }
      .typing-area > * {
        height: 260px;
      }
    }

    .sample-text {
      font-family: "Courier New", monospace;
      font-size: 1.4em;
      letter-spacing: 1px;
      background-color: #f5f5f7;
      border-radius: 8px;
      padding: 20px;
      margin: 0;
      line-height: 1.9;
      word-break: break-all;
      overflow-y: auto;
    }

    .char-correct {
      color: #2b8a3e;
    }

    .char-wrong {
      color: #ffffff;
      background-color: #ef233c;
      border-radius: 2px;
    }

    .char-current {
      color: #333;
      border-bottom: 3px solid #ef233c;
    }

    .char-pending {
      color: #bbb;
    }

    #typing-input {
      width: 100%;
      font-family: "Courier New", monospace;
      font-size: 1.3em;
      letter-spacing: 1px;
      padding: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      resize: none;
      margin: 0;
    }

    #typing-input:focus {
      outline: none;
      border-color: #ef233c;
    }

    /* 結果画面 */
    #result-screen {
      display: none;
      text-align: center;
    }

    .result-numbers {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .result-item {
      margin: 10px;
    }

    .result-item .value {
      font-size: 2em;
      font-weight: bold;
      color: #ef233c;
    }

    .result-item .label {
      color: #666;
      font-size: 0.9em;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <header>
    <h1>タイピング練習 ⌨️</h1>
    <p>短い物語を、日本語のまま入力する練習をしよう(毎回ランダムに変わります)</p>
  </header>

  <main>

    <!-- スタート画面 -->
    <div class="card" id="start-screen">
      <p>上に見本の日本語の文章、下に入力欄が出ます。いつも使っているIME(ローマ字入力→漢字変換)で、見本の通りに入力してください。</p>
      <p>文字数を選んでください(100文字単位で1000文字まで選べます)。</p>
      <div class="custom-count" style="border-top: none; padding-top: 0; margin-top: 10px;">
        <select id="count-select">
          <option value="100">100文字</option>
          <option value="200">200文字</option>
          <option value="300">300文字</option>
          <option value="400">400文字</option>
          <option value="500">500文字</option>
          <option value="600">600文字</option>
          <option value="700">700文字</option>
          <option value="800">800文字</option>
          <option value="900">900文字</option>
          <option value="1000">1000文字</option>
        </select>
        <button onclick="startGame(parseInt(document.getElementById('count-select').value, 10))">この文字数で開始</button>
      </div>
    </div>

    <!-- プレイ画面 -->
    <div class="card" id="play-screen">
      <div class="status-bar">
        <span id="timer-label">時間: 00:00</span>
        <span id="progress-label">0 / 0 文字</span>
        <span id="mistake-label">ミス: 0</span>
        <button id="sound-toggle" class="secondary" onclick="toggleSound()" style="margin: 0; padding: 6px 14px;">🔊 音</button>
      </div>

      <div class="typing-area">
        <div class="sample-text" id="sample-text"></div>
        <textarea id="typing-input" placeholder="ここをクリックして、IMEで日本語を入力してください" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- 結果画面 -->
    <div class="card" id="result-screen">
      <h2>結果発表 🎉</h2>
      <div class="result-numbers">
        <div class="result-item">
          <div class="value" id="result-speed">0</div>
          <div class="label">文字 / 分</div>
        </div>
        <div class="result-item">
          <div class="value" id="result-accuracy">0%</div>
          <div class="label">正確さ</div>
        </div>
        <div class="result-item">
          <div class="value" id="result-mistakes">0</div>
          <div class="label">ミスタイプ数</div>
        </div>
        <div class="result-item">
          <div class="value" id="result-time">0秒</div>
          <div class="label">かかった時間</div>
        </div>
      </div>
      <button onclick="backToStart()">もう一度挑戦する</button>
    </div>

  </main>

  <footer>
    <p>タイピング練習ツール</p>
  </footer>

  <script>
    // 練習に使う短い物語(3つの中からランダムに選ばれる)
    const STORIES = [
      `昔々、小さな山の麓に、一軒の古い家がありました。そこには、心優しいおじいさんと、元気いっぱいの孫娘が住んでいました。おじいさんは長い間、山で木を切る仕事をしていましたが、年をとって体が弱くなり、今は家で静かに暮らしています。孫娘の名前はゆきといい、毎日学校が終わると、おじいさんの家に遊びに行くのが日課でした。
      ある日の午後、ゆきはいつものようにおじいさんの家を訪ねました。すると、おじいさんは庭で何かを一生懸命に作っていました。近づいてみると、それは古い木の板と紐でできた、小さな凧でした。おじいさん、それは何、とゆきが尋ねると、おじいさんは優しく笑いながら答えました。これはね、わしが子どもの頃に作った凧と同じ形なんだよ。今度、一緒に空に飛ばしてみようか。
      ゆきは目を輝かせて、大きくうなずきました。二人は次の日曜日、近くの広い野原に出かけることにしました。当日は雲ひとつない、気持ちのよい青空が広がっていました。おじいさんは慣れた手つきで凧に糸をつなぎ、ゆきに持たせました。風が吹いてきたら、思い切って走るんだよ。おじいさんがそう言うと、ちょうど心地よい風が吹いてきました。
      ゆきは言われた通りに走り出しました。すると、凧はふわりと浮かび上がり、みるみるうちに空高くのぼっていきました。わあ、飛んだ、飛んだよ、おじいさん。ゆきは大きな声で叫びました。おじいさんは目を細めて、その様子を見守っていました。空に浮かぶ凧は、まるで小さな鳥のように、気持ちよさそうに風に乗っていました。
      その日から、ゆきとおじいさんは、天気のいい日にはいつも一緒に凧を飛ばすようになりました。凧はいつしか、二人だけの大切な思い出になっていきました。何年もの月日が流れ、ゆきは大人になりましたが、あの日の青い空と、風にのって飛んでいく凧の姿は、今でも彼女の心の中に、はっきりと残っています。`,

      `昔、海のそばの小さな村に、そらという名前の少年が住んでいました。そらは小さい頃から、空を飛ぶ飛行機を見るのが大好きでした。毎日、村の丘に登っては、遠くの空を横切っていく飛行機を、時間を忘れて眺めていました。いつか、あの空を自分の手で飛んでみたい。そらはいつも、そう思っていました。
      ある夏の夜、そらは家族と一緒に、丘の上で星空を見上げていました。すると、空の向こうから、一筋の光がすっと流れていきました。あ、流れ星だ。そらは思わず声をあげました。おばあさんが優しく言いました。流れ星が消える前に願いごとをすると、叶うと言われているんだよ。そらは急いで目を閉じ、心の中で強く願いました。大きくなったら、絶対にパイロットになりたい。
      それから、そらは前よりももっと熱心に勉強するようになりました。難しい算数の問題も、英語の単語も、パイロットになるために必要だと思うと、不思議と楽しく感じられました。友だちが外で遊んでいる間も、そらは図書館で飛行機の本を読みふけっていました。
      高校生になったそらは、初めて航空教室というイベントに参加しました。そこで、本物のパイロットの話を聞き、実際に操縦席に座らせてもらう機会がありました。計器の並ぶコックピットに座った瞬間、そらの胸は高鳴りました。絶対にここに戻ってくる。そう心に誓いました。
      長い年月が流れ、そらは訓練を重ね、ついに正式なパイロットになりました。初めて大きな飛行機を操縦し、故郷の村の上空を飛んだ日、そらは眼下に広がる懐かしい丘を見つけました。あの日、流れ星に願いをかけた場所です。そらは静かに微笑みながら、心の中でつぶやきました。見ていてくれ、あの日の自分。夢は、ちゃんと叶ったよ。`,

      `ある小さな町の外れに、古い時計修理店がありました。その店には、店主のおじいさんが長年かけて作った、小さなロボットが一台いました。ロボットの名前はコトといい、時計の部品を運んだり、掃除をしたりする、店の大切な助手でした。
      コトは毎日同じ仕事を繰り返す中で、ある日、ふと店の奥にある古い料理の本を見つけました。ページをめくると、そこには色とりどりのパンの写真が並んでいました。コトは今まで感じたことのない気持ちが、自分の中に生まれるのを感じました。わたしも、こんなふうに何かを作ってみたい。
      その日から、コトはこっそりと、パン作りの練習を始めました。最初は、小麦粉と水の分量がわからず、何度も失敗しました。焦げてしまったり、固くなりすぎたりする日が続きましたが、コトは諦めませんでした。おじいさんが眠っている夜の間、少しずつ、少しずつ、練習を重ねていきました。
      ある朝、おじいさんが店に降りてくると、部屋いっぱいに、香ばしいパンの匂いが広がっていました。テーブルの上には、少しいびつだけれど、こんがりと美味しそうに焼き上がったパンが置いてありました。おじいさんは驚いた顔でコトを見つめ、それから、優しく笑いました。これは、お前が作ったのかい。コトはうなずきながら、初めて胸がぽかぽかと温かくなるのを感じました。
      それ以来、時計修理店には、修理の音だけでなく、焼きたてのパンの香りも漂うようになりました。町の人々は、コトが焼くパンを楽しみに、店を訪れるようになりました。小さなロボットが見つけた、小さな幸せの物語です。`,
    ];

    let target = "";
    let sessionStarted = false;
    let startTime = 0;
    let mistakeCount = 0;
    let totalKeyPresses = 0;
    let prevValueLength = 0;
    let timerInterval = null;

    // 物語を句点(。)で1文ずつに分ける
    function toSentences(storyText) {
      return storyText
        .replace(/\s+/g, "")
        .split("。")
        .map((s) => s.trim())
        .filter((s) => s.length > 0)
        .map((s) => s + "。");
    }

    // ランダムに選んだ物語を、指定した文字数になるまで最初から順番につなげる
    function generateText(targetLength) {
      const story = STORIES[Math.floor(Math.random() * STORIES.length)];
      const sentences = toSentences(story);
      const parts = [];
      let total = 0;
      let i = 0;

      while (total < targetLength) {
        if (i >= sentences.length) i = 0; // 物語が短ければ最初に戻って続ける
        const sentence = sentences[i++];
        parts.push(sentence);
        total += sentence.length;
      }

      return parts.join("");
    }

    // --- サウンド ---
    let soundEnabled = true;
    let audioCtx = null;

    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type, volume) {
      if (!soundEnabled) return;
      const ctx = ensureAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.stop(ctx.currentTime + duration);
    }

    function playCorrectSound() {
      playTone(700, 0.05, "sine", 0.08);
    }

    function playMistakeSound() {
      playTone(180, 0.12, "square", 0.12);
    }

    function playFinishSound() {
      playTone(523, 0.15, "sine", 0.12);
      setTimeout(() => playTone(659, 0.15, "sine", 0.12), 150);
      setTimeout(() => playTone(784, 0.3, "sine", 0.12), 300);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById("sound-toggle").textContent = soundEnabled ? "🔊 音" : "🔇 音";
    }

    function startGame(count) {
      target = generateText(count);

      sessionStarted = false;
      mistakeCount = 0;
      totalKeyPresses = 0;
      prevValueLength = 0;

      document.getElementById("start-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("play-screen").style.display = "block";

      document.getElementById("timer-label").textContent = "時間: 00:00";
      document.getElementById("mistake-label").textContent = "ミス: 0";

      const inputEl = document.getElementById("typing-input");
      inputEl.value = "";
      inputEl.disabled = false;
      inputEl.focus();

      renderSampleText("");

      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerLabel, 200);
    }

    function renderSampleText(typed) {
      let html = "";
      for (let i = 0; i < target.length; i++) {
        const ch = target[i];
        if (i < typed.length) {
          const cls = typed[i] === target[i] ? "char-correct" : "char-wrong";
          html += '<span class="' + cls + '">' + ch + '</span>';
        } else if (i === typed.length) {
          html += '<span class="char-current">' + ch + '</span>';
        } else {
          html += '<span class="char-pending">' + ch + '</span>';
        }
      }
      document.getElementById("sample-text").innerHTML = html;
    }

    function updateTimerLabel() {
      if (!sessionStarted) return;
      const elapsed = Math.floor((performance.now() - startTime) / 1000);
      const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
      const ss = String(elapsed % 60).padStart(2, "0");
      document.getElementById("timer-label").textContent = "時間: " + mm + ":" + ss;
    }

    document.getElementById("typing-input").addEventListener("paste", (e) => {
      e.preventDefault();
    });

    document.getElementById("typing-input").addEventListener("input", (e) => {
      // 変換中(IMEで文字を選んでいる途中)は判定しない。確定したときだけ処理する
      if (e.isComposing) return;

      const value = e.target.value;

      if (value.length > prevValueLength) {
        // 新しく確定した文字ぶんをまとめて判定する(IMEは複数文字を一度に確定することがある)
        let hadMistake = false;
        for (let idx = prevValueLength; idx < value.length && idx < target.length; idx++) {
          totalKeyPresses++;
          if (value[idx] !== target[idx]) {
            mistakeCount++;
            hadMistake = true;
          }
        }
        if (hadMistake) {
          playMistakeSound();
        } else {
          playCorrectSound();
        }
        if (!sessionStarted) {
          sessionStarted = true;
          startTime = performance.now();
        }
      }
      prevValueLength = value.length;

      renderSampleText(value);
      const shownLength = Math.min(value.length, target.length);
      document.getElementById("progress-label").textContent = shownLength + " / " + target.length + " 文字";
      document.getElementById("mistake-label").textContent = "ミス: " + mistakeCount;

      if (value.length >= target.length) {
        finishGame();
      }
    });

    function finishGame() {
      clearInterval(timerInterval);
      document.getElementById("typing-input").disabled = true;
      document.getElementById("play-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "block";
      playFinishSound();

      const elapsedSeconds = sessionStarted
        ? (performance.now() - startTime) / 1000
        : 0;
      const speed = elapsedSeconds > 0
        ? Math.round((target.length / elapsedSeconds) * 60)
        : 0;
      const accuracy = totalKeyPresses > 0
        ? Math.round(((totalKeyPresses - mistakeCount) / totalKeyPresses) * 100)
        : 100;

      document.getElementById("result-speed").textContent = speed;
      document.getElementById("result-accuracy").textContent = accuracy + "%";
      document.getElementById("result-mistakes").textContent = mistakeCount;
      document.getElementById("result-time").textContent = Math.round(elapsedSeconds) + "秒";
    }

    function backToStart() {
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("start-screen").style.display = "block";
    }
  </script>

</body>
</html>
