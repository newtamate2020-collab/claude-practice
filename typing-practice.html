<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイピング練習 - ことわざ編</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #f5f5f7;
      color: #333;
      margin: 0;
      padding: 0;
      line-height: 1.7;
    }

    header {
      background-color: #2b2d42;
      color: #ffffff;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      margin: 0 0 8px 0;
      font-size: 1.8em;
    }

    header p {
      margin: 0;
      color: #cfd2e3;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    #start-screen {
      text-align: center;
    }

    button {
      font-size: 1em;
      font-weight: bold;
      padding: 12px 24px;
      margin: 6px;
      border: none;
      border-radius: 6px;
      background-color: #ef233c;
      color: #ffffff;
      cursor: pointer;
    }

    button:hover {
      background-color: #d90429;
    }

    button.secondary {
      background-color: #2b2d42;
    }

    button.secondary:hover {
      background-color: #454873;
    }

    .custom-count {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .custom-count input[type="number"] {
      width: 100px;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-right: 8px;
      text-align: center;
    }

    /* プレイ中の画面 */
    #play-screen {
      display: none;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.95em;
      color: #666;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status-bar span {
      background-color: #f5f5f7;
      padding: 6px 12px;
      border-radius: 6px;
    }

    .kanji-text {
      color: #888;
      font-size: 0.95em;
      margin-bottom: 16px;
      padding: 12px 16px;
      background-color: #f0f4ff;
      border-radius: 8px;
    }

    .sample-text {
      font-family: "Courier New", monospace;
      font-size: 1.4em;
      letter-spacing: 1px;
      background-color: #f5f5f7;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      line-height: 1.9;
      word-break: break-all;
    }

    .char-correct {
      color: #2b8a3e;
    }

    .char-wrong {
      color: #ffffff;
      background-color: #ef233c;
      border-radius: 2px;
    }

    .char-current {
      color: #333;
      border-bottom: 3px solid #ef233c;
    }

    .char-pending {
      color: #bbb;
    }

    #typing-input {
      width: 100%;
      box-sizing: border-box;
      font-family: "Courier New", monospace;
      font-size: 1.3em;
      letter-spacing: 1px;
      padding: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      resize: none;
      height: 100px;
    }

    #typing-input:focus {
      outline: none;
      border-color: #ef233c;
    }

    /* 結果画面 */
    #result-screen {
      display: none;
      text-align: center;
    }

    .result-numbers {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .result-item {
      margin: 10px;
    }

    .result-item .value {
      font-size: 2em;
      font-weight: bold;
      color: #ef233c;
    }

    .result-item .label {
      color: #666;
      font-size: 0.9em;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <header>
    <h1>タイピング練習 ⌨️</h1>
    <p>日本語のことわざで、ローマ字入力の練習をしよう</p>
  </header>

  <main>

    <!-- スタート画面 -->
    <div class="card" id="start-screen">
      <p>上に見本の文章、下に入力欄が出ます。見本の通りにローマ字で入力してください。</p>
      <p>文字数を選んでください。</p>
      <div>
        <button onclick="startGame(50)">50文字</button>
        <button onclick="startGame(100)">100文字</button>
        <button onclick="startGame(200)">200文字</button>
      </div>
      <div class="custom-count">
        <p>文字数を自分で決めることもできます。</p>
        <input type="number" id="custom-count-input" min="10" max="2000" value="150">
        <button class="secondary" onclick="startGame(getCustomCount())">この文字数で開始</button>
      </div>
    </div>

    <!-- プレイ画面 -->
    <div class="card" id="play-screen">
      <div class="status-bar">
        <span id="timer-label">時間: 00:00</span>
        <span id="progress-label">0 / 0 文字</span>
        <span id="mistake-label">ミス: 0</span>
      </div>

      <div class="kanji-text" id="kanji-text"></div>

      <div class="sample-text" id="sample-text"></div>

      <textarea id="typing-input" placeholder="ここをクリックしてローマ字で入力を始めてください" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    </div>

    <!-- 結果画面 -->
    <div class="card" id="result-screen">
      <h2>結果発表 🎉</h2>
      <div class="result-numbers">
        <div class="result-item">
          <div class="value" id="result-speed">0</div>
          <div class="label">文字 / 分</div>
        </div>
        <div class="result-item">
          <div class="value" id="result-accuracy">0%</div>
          <div class="label">正確さ</div>
        </div>
        <div class="result-item">
          <div class="value" id="result-mistakes">0</div>
          <div class="label">ミスタイプ数</div>
        </div>
        <div class="result-item">
          <div class="value" id="result-time">0秒</div>
          <div class="label">かかった時間</div>
        </div>
      </div>
      <button onclick="backToStart()">もう一度挑戦する</button>
    </div>

  </main>

  <footer>
    <p>タイピング練習ツール</p>
  </footer>

  <script>
    // 練習に使うことわざ一覧(漢字・読み・ローマ字・意味)
    const PROVERBS = [
      { kanji: "猿も木から落ちる", romaji: "sarumokikaraochiru" },
      { kanji: "石の上にも三年", romaji: "ishinouenimosannen" },
      { kanji: "七転び八起き", romaji: "nanakorobiyaoki" },
      { kanji: "花より団子", romaji: "hanayoridango" },
      { kanji: "案ずるより産むが易し", romaji: "anzuruyoriumugayasushi" },
      { kanji: "塵も積もれば山となる", romaji: "chirimotsumorebayamatonaru" },
      { kanji: "光陰矢の如し", romaji: "kouinyanogotoshi" },
      { kanji: "二兎を追う者は一兎をも得ず", romaji: "nitowoumonohaittowomoezu" },
      { kanji: "井の中の蛙大海を知らず", romaji: "inonakanokawazutaikaiwoshirazu" },
      { kanji: "覆水盆に返らず", romaji: "fukusuibonnikaerazu" },
      { kanji: "千里の道も一歩から", romaji: "senrinomichimoippokara" },
      { kanji: "良薬は口に苦し", romaji: "ryouyakuhakuchininigashi" },
      { kanji: "灯台下暗し", romaji: "toudaimotokurashi" },
      { kanji: "継続は力なり", romaji: "keizokuhachikaranari" },
      { kanji: "早起きは三文の徳", romaji: "hayaokihasanmonnotoku" },
    ];

    let target = "";
    let kanjiDisplay = "";
    let sessionStarted = false;
    let startTime = 0;
    let mistakeCount = 0;
    let totalKeyPresses = 0;
    let prevValueLength = 0;
    let timerInterval = null;

    function shuffle(array) {
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getCustomCount() {
      const input = document.getElementById("custom-count-input");
      const value = parseInt(input.value, 10);
      if (!value || value < 10) return 50;
      return value;
    }

    // 指定した文字数になるまで、ことわざをランダムにつなげて文章を作る
    function generateText(targetLength) {
      const kanjiParts = [];
      const romajiParts = [];
      let total = 0;
      let pool = shuffle(PROVERBS);
      let i = 0;

      while (total < targetLength) {
        if (i >= pool.length) {
          pool = shuffle(PROVERBS);
          i = 0;
        }
        const item = pool[i++];
        kanjiParts.push(item.kanji);
        romajiParts.push(item.romaji);
        total += item.romaji.length + 1;
      }

      return {
        kanjiDisplay: kanjiParts.join(" ・ "),
        romajiTarget: romajiParts.join(" "),
      };
    }

    function startGame(count) {
      const generated = generateText(count);
      target = generated.romajiTarget;
      kanjiDisplay = generated.kanjiDisplay;

      sessionStarted = false;
      mistakeCount = 0;
      totalKeyPresses = 0;
      prevValueLength = 0;

      document.getElementById("start-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("play-screen").style.display = "block";

      document.getElementById("kanji-text").textContent = "見本(漢字): " + kanjiDisplay;
      document.getElementById("timer-label").textContent = "時間: 00:00";
      document.getElementById("mistake-label").textContent = "ミス: 0";

      const inputEl = document.getElementById("typing-input");
      inputEl.value = "";
      inputEl.maxLength = target.length;
      inputEl.disabled = false;
      inputEl.focus();

      renderSampleText("");

      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerLabel, 200);
    }

    function renderSampleText(typed) {
      let html = "";
      for (let i = 0; i < target.length; i++) {
        const ch = target[i] === " " ? "&nbsp;" : target[i];
        if (i < typed.length) {
          const cls = typed[i] === target[i] ? "char-correct" : "char-wrong";
          html += '<span class="' + cls + '">' + ch + '</span>';
        } else if (i === typed.length) {
          html += '<span class="char-current">' + ch + '</span>';
        } else {
          html += '<span class="char-pending">' + ch + '</span>';
        }
      }
      document.getElementById("sample-text").innerHTML = html;
    }

    function updateTimerLabel() {
      if (!sessionStarted) return;
      const elapsed = Math.floor((performance.now() - startTime) / 1000);
      const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
      const ss = String(elapsed % 60).padStart(2, "0");
      document.getElementById("timer-label").textContent = "時間: " + mm + ":" + ss;
    }

    document.getElementById("typing-input").addEventListener("paste", (e) => {
      e.preventDefault();
    });

    document.getElementById("typing-input").addEventListener("input", (e) => {
      const value = e.target.value;

      if (value.length > prevValueLength) {
        // 新しい文字が追加された
        const idx = value.length - 1;
        totalKeyPresses++;
        if (value[idx] !== target[idx]) {
          mistakeCount++;
        }
        if (!sessionStarted) {
          sessionStarted = true;
          startTime = performance.now();
        }
      }
      prevValueLength = value.length;

      renderSampleText(value);
      document.getElementById("progress-label").textContent = value.length + " / " + target.length + " 文字";
      document.getElementById("mistake-label").textContent = "ミス: " + mistakeCount;

      if (value.length >= target.length) {
        finishGame();
      }
    });

    function finishGame() {
      clearInterval(timerInterval);
      document.getElementById("typing-input").disabled = true;
      document.getElementById("play-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "block";

      const elapsedSeconds = sessionStarted
        ? (performance.now() - startTime) / 1000
        : 0;
      const speed = elapsedSeconds > 0
        ? Math.round((target.length / elapsedSeconds) * 60)
        : 0;
      const accuracy = totalKeyPresses > 0
        ? Math.round(((totalKeyPresses - mistakeCount) / totalKeyPresses) * 100)
        : 100;

      document.getElementById("result-speed").textContent = speed;
      document.getElementById("result-accuracy").textContent = accuracy + "%";
      document.getElementById("result-mistakes").textContent = mistakeCount;
      document.getElementById("result-time").textContent = Math.round(elapsedSeconds) + "秒";
    }

    function backToStart() {
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("start-screen").style.display = "block";
    }
  </script>

</body>
</html>
